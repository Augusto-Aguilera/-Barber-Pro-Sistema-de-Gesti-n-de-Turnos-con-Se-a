<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Turnos | PATRIC SOFT ®</title>
    <link rel="icon" href="https://fav.farm/💈">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body style="padding: 40px; background-color: #000;">
    <h1 style="font-family: 'Bebas Neue'; color: var(--gold); font-size: 3.5rem; letter-spacing: 3px;">AGENDA DEL DÍA</h1>
    
    <table class="admin-table" id="tabla-admin">
        <thead>
            <tr>
                <th>CLIENTE</th>
                <th>SERVICIO</th>
                <th>FECHA</th>
                <th>HORA</th>
                <th>SEÑA</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <button onclick="limpiar()" style="margin-top: 30px; padding: 15px 30px; background: transparent; border: 2px solid #c0392b; color: #c0392b; font-family: 'Bebas Neue'; font-size: 1.2rem; cursor: pointer; border-radius: 8px;">
        VACIAR TODA LA AGENDA
    </button>

    <script>
        function mostrar() {
            // USAMOS sessionStorage PARA QUE SE LIMPIE AUTOMÁTICAMENTE
            const data = JSON.parse(sessionStorage.getItem('turnos_barberia')) || [];
            const body = document.querySelector('#tabla-admin tbody');
            body.innerHTML = "";
            
            data.forEach(t => {
                let r = body.insertRow();
                r.insertCell(0).innerText = t.cliente;
                r.insertCell(1).innerText = t.servicio;
                r.insertCell(2).innerText = t.fecha;
                r.insertCell(3).innerText = t.hora;
                r.insertCell(4).innerText = t.pago;
            });
        }

        function limpiar() {
            if(confirm("¿Estás seguro de borrar toda la agenda?")) {
                sessionStorage.removeItem('turnos_barberia');
                mostrar();
            }
        }

        mostrar();
    </script>
</body>
</html>
